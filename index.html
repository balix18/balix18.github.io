<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Name</title>
<style>
  :root {
    --bg: #0d1117;
    --bg-raised: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text-dim: #8b949e;
    --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    max-width: 720px;
    margin: 0 auto;
    padding: 4rem 1.5rem 2rem;
  }
  header h1 {
    font-size: 1.75rem;
    margin: 0 0 0.4rem;
  }
  header p {
    color: var(--text-dim);
    margin: 0;
  }
  nav {
    display: flex;
    gap: 1.25rem;
    margin-top: 1.5rem;
  }
  nav a {
    color: var(--accent);
    text-decoration: none;
    font-size: 0.95rem;
  }
  nav a:hover { text-decoration: underline; }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 1rem 1.5rem 4rem;
  }
  section { margin-top: 3rem; }
  section h2 {
    font-size: 1.1rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.5rem;
    margin-bottom: 1rem;
  }
  .placeholder {
    border: 1px dashed var(--border);
    border-radius: 6px;
    padding: 1.5rem;
    color: var(--text-dim);
    font-size: 0.95rem;
  }
  footer {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 1.5rem 3rem;
    color: var(--text-dim);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <header>
    <h1>Balazs Oczot</h1>
    <p>Software engineer.</p>
    <nav>
      <a href="#projects">Projects</a>
      <a href="#cv">CV</a>
    </nav>
  </header>

  <main>
    <section id="projects">
      <h2>Open source projects</h2>
      <div class="placeholder">Switch homebrew</div>
      <div class="placeholder">Linux kernel hacking</div>
      <div class="placeholder">radio-pi</div>
      <div class="placeholder">catalearning</div>
    </section>

    <section id="cv">
      <h2>CV</h2>
      <div class="placeholder">CV coming soon.</div>
    </section>
  </main>

  <footer>
    &copy; 2026 Balazs Oczot
  </footer>
</body>
</html>
